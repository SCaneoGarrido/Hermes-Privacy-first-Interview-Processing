version: "1.0"

project:
  name: Hermes
  description: Official documentation sources approved for the Hermes project.

rules:
  priority:
    - Official Documentation
    - Official GitHub Repository
    - Language Reference
    - Microsoft Learn
    - Standards (ISO / WG21)
    - Approved Books

  avoid:
    - Random blogs
    - Medium
    - Stack Overflow as primary documentation
    - AI generated tutorials without verification

sources:

  cpp:
    name: C++ Language
    official:
      - https://isocpp.org/
      - https://en.cppreference.com/
      - https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines
      - https://wg21.link/

  cmake:
    name: CMake
    official:
      - https://cmake.org/documentation/
      - https://cmake.org/cmake/help/latest/
      - https://cmake.org/cmake/help/latest/guide/tutorial/

  vcpkg:
